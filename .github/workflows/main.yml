name: Daily Naukri Auto Update

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 7 * * *'   # 1:00 PM IST
    - cron: '30 11 * * *'  # 4:30 PM IST
  workflow_dispatch:       # Allows you to trigger it manually anytime via phone

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Naukri Update Engine
        uses: Prateek-Wayne/naukri-resume-action@v1.2.0
        with:
          username: ${{ secrets.NAUKRI_USERNAME }}
          naukri_cookies: ${{ secrets.NAUKRI_COOKIES }}
          profile_id: ${{ secrets.NAUKRI_PROFILE_ID }}
          resume_path: "Prathik_Pramod_Java_Backend_Developer.pdf"
          # Providing a string fallback forces an update flag even without a physical file
          profile_summary: "Experienced technical professional seeking backend engineering roles. Proficient in building microservices and optimizing system performance." 
          
